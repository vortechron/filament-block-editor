laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider

env:
  - APP_NAME="Filament Block Editor"
  - DB_CONNECTION=sqlite

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
  assets:
    - filament-block-editor-assets
